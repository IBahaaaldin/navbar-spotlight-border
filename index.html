  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],

  <style>
    /* Smooth global theme transition */
    html, body {
      transition: background-color 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  color 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Interactive Spotlight Border Effect */
    .spotlight-card {
      position: relative;
      background: rgba(10, 12, 18, 0.88);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85);
    }
    html:not(.dark) .spotlight-card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
    }

    /* Glowing radial spotlight pseudo-border */
    .spotlight-glow::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1.5px;
      background: radial-gradient(220px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(56, 189, 248, 0.65), rgba(168, 85, 247, 0.35) 40%, transparent 80%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .spotlight-glow:hover::before {
      opacity: 1;
    }

    /* Shimmer badge animation */
    @keyframes shimmerMove {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    .shimmer-badge {
      position: relative;
      overflow: hidden;
    }
    .shimmer-badge::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      animation: shimmerMove 2.5s infinite;
    }

    /* Mobile drawer smooth transition */
    #mobileSpotlightMenu {
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Prevent text wrapping across entire navbar */
    .no-wrap {
      white-space: nowrap;
    }
  </style>
</head>

  <!-- INTERACTIONS JAVASCRIPT: SPOTLIGHT TRACKING & CONTROLS -->
  <!-- ======================================================== -->
  <script>
    // 1. Interactive Cursor Spotlight Tracker
    const nav = document.getElementById('spotlightNav');
    if (nav) {
      nav.addEventListener('mousemove', (e) => {
        const rect = nav.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        nav.style.setProperty('--mouse-x', `${x}px`);
        nav.style.setProperty('--mouse-y', `${y}px`);
      });
    }

    // 2. Theme Toggle (Pure #000000 <-> #ffffff)
    const html = document.documentElement;
    const body = document.body;
    const themeBtn = document.getElementById('themeToggleBtn');

    themeBtn.addEventListener('click', () => {
      html.classList.toggle('dark');
      const isDark = html.classList.contains('dark');
      body.style.backgroundColor = isDark ? '#000000' : '#ffffff';

      themeBtn.style.transform = 'rotate(180deg)';
      setTimeout(() => {
        themeBtn.style.transform = 'none';
      }, 300);
    });

    // 3. Real Responsive Mobile Navigation Drawer
    const mobileBtn = document.getElementById('mobileSpotlightBtn');
    const mobileMenu = document.getElementById('mobileSpotlightMenu');
    const backdrop = document.getElementById('spotlightBackdrop');
    const sLineTop = document.getElementById('sLineTop');
    const sLineMid = document.getElementById('sLineMid');
    const sLineBot = document.getElementById('sLineBot');

    function openMobile() {
      mobileMenu.classList.remove('hidden');
      mobileMenu.classList.add('flex');
      backdrop.classList.remove('hidden');
      requestAnimationFrame(() => {
        mobileMenu.classList.remove('opacity-0', '-translate-y-2', 'pointer-events-none');
        mobileMenu.classList.add('opacity-100', 'translate-y-0');
        backdrop.classList.remove('opacity-0');
        backdrop.classList.add('opacity-100');
      });
      if (sLineTop && sLineMid && sLineBot) {
        sLineTop.setAttribute('transform', 'rotate(45 12 12) translate(0, 5)');
        sLineMid.style.opacity = '0';
        sLineBot.setAttribute('transform', 'rotate(-45 12 12) translate(0, -5)');
      }
    }

    function closeMobile() {
      mobileMenu.classList.add('opacity-0', '-translate-y-2', 'pointer-events-none');
      mobileMenu.classList.remove('opacity-100', 'translate-y-0');
      backdrop.classList.remove('opacity-100');
      backdrop.classList.add('opacity-0');
      setTimeout(() => {
        mobileMenu.classList.add('hidden');
        mobileMenu.classList.remove('flex');
        backdrop.classList.add('hidden');
      }, 250);
      if (sLineTop && sLineMid && sLineBot) {
        sLineTop.removeAttribute('transform');
        sLineMid.style.opacity = '1';
        sLineBot.removeAttribute('transform');
      }
    }

    if (mobileBtn && mobileMenu) {
      mobileBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = !mobileMenu.classList.contains('hidden') && !mobileMenu.classList.contains('pointer-events-none');
        if (isOpen) {
          closeMobile();
        } else {
          openMobile();
        }
      });
    }

    if (backdrop) backdrop.addEventListener('click', closeMobile);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeMobile();
    });
  </script>
